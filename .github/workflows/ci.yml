name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://poetry.darshanregmi.com.np
      # Public Firebase values are safe to inline; these are placeholders so the
      # client bundle can be built without production credentials.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCI-placeholder-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: i-feel-therefore-i-write.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: i-feel-therefore-i-write
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: i-feel-therefore-i-write.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      # Static generation queries Notion. Add these as repository secrets, or the
      # build step below stays non-blocking.
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Baseline: cloudflare-worker/worker.ts is missing the Cloudflare Worker
      # ambient types (ScheduledEvent, ExecutionContext). Non-blocking until the
      # worker has its own tsconfig or types; remove in the cleanup step.
      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      # Baseline: 4 unescaped entities in about-the-author/page.tsx and one
      # unused variable in lib/notion.ts. Non-blocking until those are fixed.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # The build reads Notion during static generation. Without repository
      # secrets it cannot be a hard gate yet, so keep it non-blocking.
      - name: Build
        run: npm run build
        continue-on-error: true
